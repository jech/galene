<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Galène</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="ScreenOrientation" content="autoRotate:disabled">
    <link rel="stylesheet" type="text/css" href="/common.css"/>
    <link rel="stylesheet" type="text/css" href="/galene.css"/>
    <link rel="author" href="https://www.irif.fr/~jch/"/>
    <link rel="stylesheet" type="text/css" href="/third-party/fontawesome/css/fontawesome.min.css"/>
    <link rel="stylesheet" type="text/css" href="/third-party/fontawesome/css/solid.min.css"/>
    <link rel="stylesheet" type="text/css" href="/third-party/fontawesome/css/regular.min.css"/>
    <link rel="stylesheet" type="text/css" href="/third-party/toastify/toastify.css"/>
    <link rel="stylesheet" type="text/css" href="/third-party/contextual/contextual.css"/>
  </head>

  <body>
    <div id="main" class="app">
      <div class="row full-height">
        <nav id="left-sidebar">
          <div class="users-header">
            <div class="galene-header">Galène</div>
          </div>
          <div class="header-sep"></div>
          <div id="users"></div>
        </nav>
        <div class="container">
          <header>
            <nav class="topnav navbar navbar-expand navbar-light">
              <div id="header">
                <div class="collapse" title="Collapse left panel" data-i18n-title="Collapse left panel" id="sidebarCollapse">
                  <i class="fas fa-align-left" aria-hidden="true"></i>
                </div>
                <h1 id="title" class="header-title">Galène</h1>
              </div>

              <ul class="nav-menu">
                <li>
                  <button id="presentbutton" class="invisible btn btn-success">
                    <i class="fas fa-play" aria-hidden="true"></i> <span class="nav-text" data-i18n="Enable">Enable</span>
                  </button>
                </li>
                <li>
                  <button id="unpresentbutton" class="invisible btn btn-cancel">
                    <i class="fas fa-stop" aria-hidden="true"></i> <span class="nav-text" data-i18n="Disable">Disable</span>
                  </button>
                </li>
                <li>
                  <div id="mutebutton" class="nav-link nav-button">
                    <span><i class="fas fa-microphone-slash" aria-hidden="true"></i></span>
                    <label data-i18n="Mute">Mute</label>
                  </div>
                </li>
                <li>
                  <div id="sharebutton" class="invisible nav-link nav-button">
                    <span><i class="fas fa-share-square" aria-hidden="true"></i></span>
                    <label data-i18n="Share Screen">Share Screen</label>
                  </div>
                </li>
                <li>
                  <div class="nav-button nav-link nav-more" id="openside">
                    <span><i class="fas fa-ellipsis-v" aria-hidden="true"></i></span>
                  </div>
                </li>
              </ul>
            </nav>
          </header>
          <div class="row full-width" id="mainrow">
            <div class="coln-left" id="left">
              <div id="chat">
                <div id="chatbox">
                  <div class="close-chat" id="close-chat"  title="Hide chat" data-i18n-title="Hide chat">
                    <span class="close-icon"></span>
                  </div>
                  <div id="box"></div>
                  <div class="reply">
                    <form id="inputform">
                      <textarea id="input" class="form-reply"></textarea>
                      <input id="inputbutton" type="submit" value="&#10148;" class="btn btn-default"/>
                    </form>
                  </div>
                </div>
              </div>
            </div>
            <div id="resizer"></div>
            <div class="coln-right" id="right">
              <span class="show-video blink invisible" id="show-video">
                <i class="fas fa-exchange-alt" aria-hidden="true"></i>
              </span>
              <div class="chat-btn show-chat invisible" id="show-chat">
                <i class="far fa-comment-alt icon-chat" title="Show chat" data-i18n-title="Show chat"></i>
              </div>
              <div class="chat-btn collapse-video invisible" id="collapse-video">
                <i class="far fa-comment-alt icon-chat" title="Hide video and show chat" data-i18n-title="Hide video and show chat"></i>
              </div>
              <div class="video-container invisible" id="video-container">
                <div id="expand-video" class="expand-video">
                  <div id="peers"></div>
                </div>
              </div>
              <div id="captions-container" class="invisible">
                <div id="captions"></div>
              </div>
              <div class="login-container invisible" id="login-container">
                <div class="login-box">
                  <form id="loginform" class="loginform">
                    <div id="userform">
                      <label for="username" data-i18n="Username">Username</label>
                      <input id="username" type="text" name="username"
                             autocomplete="username" class="form-control"/>
                    </div>
                    <div id="passwordform">
                      <label for="password" data-i18n="Password">Password</label>
                      <input id="password" type="password" name="password"
                             autocomplete="current-password" class="form-control"/>
                    </div>
                    <label data-i18n="Enable at start:">Enable at start:</label>
                    <div class="present-switch">
                      <p class="switch-radio">
                        <input id="presentoff" type="radio" name="presentradio" value="" checked/>
                        <label for="presentoff" data-i18n="Nothing">Nothing</label>
                      </p>
                      <p class="switch-radio">
                        <input id="presentmike" type="radio" name="presentradio" value="mike"/>
                        <label for="presentmike" data-i18n="Microphone">Microphone</label>
                      </p>
                      <p class="switch-radio">
                        <input id="presentboth" type="radio" name="presentradio" value="both"/>
                        <label for="presentboth" data-i18n="Camera and microphone">Camera and microphone</label>
                      </p>
                    </div>
                    <div class="clear"></div>
                    <div class="connect">
                      <input id="connectbutton" type="submit" class="btn btn-blue" value="Connect" data-i18n-value="Connect"/>
                    </div>
                  </form>
                </div>
                <details id="test-camera">
                  <summary data-i18n="Test camera and microphone">Test camera and microphone</summary>
                  <fieldset>
                    <label for="test-videoselect" class="sidenav-label-first" data-i18n="Camera:">Camera:</label>
                    <select id="test-videoselect" class="select select-inline">
                      <option value="" data-i18n="off">off</option>
                    </select>

                    <label for="test-audioselect" class="sidenav-label" data-i18n="Microphone:">Microphone:</label>
                    <select id="test-audioselect" class="select select-inline">
                      <option value="" data-i18n="off">off</option>
                    </select>
                  </fieldset>
                  <video id="test-video" controls muted autoplay playsInline></video>
                  <canvas id="test-fft" width=320 height=50></canvas>
                </details>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="sidebarnav" class="sidenav">
      <div class="sidenav-header">
        <h2 data-i18n="Settings">Settings</h2>
        <a class="closebtn" id="clodeside"><i class="fas fa-times" aria-hidden="true"></i></a>
      </div>
      <div class="sidenav-content" id="optionsdiv">
        <div id="profile" class="profile invisible">
          <div class="profile-user">
            <div class="profile-logo">
              <span><i class="fas fa-user" aria-hidden="true"></i></span>
            </div>
            <div class="profile-info">
              <span id="userspan"></span>
              <span id="permspan"></span>
              <span id="chpwspan" class="invisible"><a id="change-password" data-i18n="Change password">Change password</a></span>
            </div>
            <div class="user-logout">
              <a id="disconnectbutton">
                <span class="logout-icon"><i class="fas fa-sign-out-alt"></i></span>
                <span class="logout-text" data-i18n="Logout">Logout</span>
              </a>
            </div>
          </div>
        </div>
        <div id="mediaoptions" class="invisible">
          <fieldset>
            <legend data-i18n="Media Options">Media Options</legend>
            <label for="videoselect" class="sidenav-label-first" data-i18n="Camera:">Camera:</label>
            <select id="videoselect" class="select select-inline">
              <option value="" data-i18n="off">off</option>
            </select>
  
            <label for="audioselect" class="sidenav-label" data-i18n="Microphone:">Microphone:</label>
            <select id="audioselect" class="select select-inline">
              <option value="" data-i18n="off">off</option>
            </select>

            <form>
              <input id="mirrorbox" type="checkbox" checked/>
              <label for="mirrorbox" data-i18n="Mirror view">Mirror view</label>
            </form>

            <form>
              <input id="blackboardbox" type="checkbox"/>
              <label for="blackboardbox" data-i18n="Blackboard mode">Blackboard mode</label>
            </form>
  
            <form>
              <input id="preprocessingbox" type="checkbox" checked/>
              <label for="preprocessingbox" data-i18n="Noise suppression">Noise suppression</label>
            </form>

            <form>
              <input id="hqaudiobox" type="checkbox"/>
              <label for="hqaudiobox" data-i18n="High-quality audio">High-quality audio</label>
            </form>

          </fieldset>
        </div>

        <fieldset>
          <legend data-i18n="Other Settings">Other Settings</legend>

          <form id="filterform">
            <label for="filterselect" class="sidenav-label-first" data-i18n="Filter:">Filter:</label>
            <select id="filterselect" class="select select-inline">
              <option value="" selected data-i18n="none">none</option>
            </select>
          </form>

          <form id="sendform">
            <label for="sendselect" class="sidenav-label-first" data-i18n="Send:">Send:</label>
            <select id="sendselect" class="select select-inline">
              <option value="lowest" data-i18n="lowest">lowest</option>
              <option value="low" data-i18n="low">low</option>
              <option value="normal" selected data-i18n="normal">normal</option>
              <option value="unlimited" data-i18n="unlimited">unlimited</option>
            </select>
          </form>

          <form id="simulcastform">
            <label for="simulcastselect" class="sidenav-label-first" data-i18n="Simulcast:">Simulcast:</label>
            <select id="simulcastselect" class="select select-inline">
              <option value="off" data-i18n="off">off</option>
              <option value="auto" selected data-i18n="auto">auto</option>
              <option value="on" data-i18n="on">on</option>
            </select>
          </form>

          <form id="requestform">
            <label for="requestselect" class="sidenav-label" data-i18n="Receive:">Receive:</label>
            <select id="requestselect" class="select select-inline">
              <option value="" data-i18n="nothing">nothing</option>
              <option value="audio" data-i18n="audio only">audio only</option>
              <option value="screenshare" data-i18n="screenshare only">screenshare only</option>
              <option value="everything-low" data-i18n="low quality">low quality</option>
              <option value="everything" selected data-i18n="everything">everything</option>
            </select>
          </form>
  
          <form>
            <input id="activitybox" type="checkbox"/>
            <label for="activitybox" data-i18n="Activity detection">Activity detection</label>
          </form>

          <form>
            <input id="displayallbox" type="checkbox"/>
            <label for="displayallbox" data-i18n="Display audio-only users">Display audio-only users</label>
          </form>
        </fieldset>
      </div>
    </div>

    <div id="videocontrols-template" class="invisible">
      <div class="video-controls vc-overlay">
        <div class="controls-button controls-left">
          <span class="video-play" title="Play video" data-i18n-title="Play video">
            <i class="fas fa-play"></i>
          </span>
          <span class="volume" title="Volume" data-i18n-title="Volume">
            <i class="fas fa-volume-up volume-mute" aria-hidden="true"></i>
            <input class="volume-slider" type="range" max="100" value="100" min="0" step="5" >
          </span>
        </div>
        <div class="controls-button controls-right">
          <span class="pip" title="Picture In Picture" data-i18n-title="Picture In Picture">
            <i class="far fa-clone" aria-hidden="true"></i>
          </span>
          <span class="fullscreen" title="Fullscreen" data-i18n-title="Fullscreen">
            <i class="fas fa-expand" aria-hidden="true"></i>
          </span>
        </div>
      </div>
    </div>
    <div id="topvideocontrols-template" class="invisible">
      <div class="top-video-controls">
        <div class="controls-button controls-right">
          <span class="close-icon video-stop" title="Stop video" data-i18n-title="Stop video">
          </span>
        </div>
      </div>
    </div>

    <dialog id="invite-dialog">
      <form method="dialog">
        <label for="invite-username" data-i18n="Username (optional):">Username (optional):</label>
        <input id="invite-username" type="text"/>
        <br>
        <label for="invite-not-before" data-i18n="Not before:">Not before:</label>
        <input id="invite-not-before" type="datetime-local"/>
        <br>
        <label for="invite-expires" data-i18n="Expires:">Expires:</label>
        <input id="invite-expires" type="datetime-local"/>
        <br>
        <button id="invite-cancel" value="cancel" type="button" data-i18n="Cancel">Cancel</button>
        <button value="invite" data-i18n="Invite">Invite</button>
      </form>
    </dialog>

    <script src="/i18n.js" defer></script>
    <script src="/protocol.js" defer></script>
    <script src="/third-party/toastify/toastify.js" defer></script>
    <script src="/third-party/contextual/contextual.js" defer></script>
    <script src="/settings.js" defer></script>
    <script src="/filter.js" defer></script>
    <script src="/camera-test.js" defer></script>
    <script src="/galene.js" defer></script>
  </body>
</html>
